<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Privacy Eraser · 隐私橡皮擦 — 本地检查与清理图片元数据</title>
    <meta
      name="description"
      content="Privacy Eraser 在浏览器本地读取图片的 EXIF、GPS、XMP、IPTC、ICC 等信息，按字节删除元数据并重新解析验证导出结果。图片永不上传。"
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Privacy Eraser · 隐私橡皮擦" />
    <meta
      property="og:description"
      content="上传—检查—清理—导出：在浏览器本地看清图片暴露了什么，并导出真正清理过的文件。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@0xkillcoin" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5a4'/%3E%3Cpath d='M10 22l12-12M12 10h10v10' stroke='%23ffffff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      html[data-theme='light'] body { background: #f4f6fb; }
      html[data-theme='dark'] body { background: #0b1017; }
      body { margin: 0; }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('privacy-eraser:theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
            return;
          }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (error) {
          /* storage may be blocked; the light default still works */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font: 14px/1.6 system-ui, sans-serif">
        Privacy Eraser 需要 JavaScript 才能在本地读取图片。所有处理都在你的浏览器里完成。
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
